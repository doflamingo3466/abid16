<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">
    <div class="card p-4 mx-auto">
        <h2 class="text-center mb-2">Quiz App</h2>
        <p class="text-center subtitle mb-4">Test your knowledge</p>

        <form id="studentForm">
            <label class="form-label">Student Name</label>
            <input type="text" id="studentName" class="form-control mb-3" placeholder="Enter your name" required>

            <label class="form-label">Roll Number</label>
            <input type="text" id="rollNumber" class="form-control mb-4" placeholder="Enter your roll number" required>

            <button class="btn btn-success w-100">Start Quiz</button>
        </form>

        <div id="quiz" hidden>
            <p id="number" class="subtitle mt-4"></p>
            <h5 id="question" class="mb-4"></h5>

            <form id="quizForm">
                <div id="options"></div>
                <button class="btn btn-success w-100 mt-3">Next Question</button>
            </form>
        </div>

        <div id="result" hidden></div>

        <div class="mt-4">
            <h5>Previous Results</h5>
            <div id="history"></div>
            <button id="clearHistory" class="btn btn-outline-danger btn-sm mt-2">Clear History</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
